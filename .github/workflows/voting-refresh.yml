name: Refresh proxy voting sources
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/voting-refresh.yml"
  schedule:
    - cron: "15 8 * * 1-5"
permissions:
  contents: write
concurrency:
  group: proxy-voting-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: npm run test:uk
      - name: Refresh voting sources and leadership signals
        run: |
          python scripts/build_dataset.py
          python scripts/build_leadership_radar.py
          python scripts/build_leadership_calibration.py
      - name: Commit verified refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed data/ftse100_constituents.json data/roster_readiness.json public/data/tracker-data.json public/data/leadership-radar.json public/data/leadership-calibration.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh proxy voting evidence"
          git pull --rebase origin main
          git push
