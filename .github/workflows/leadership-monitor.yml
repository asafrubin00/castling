name: Monitor UK leadership announcements

on:
  workflow_dispatch:
  schedule:
    - cron: "45 7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: uk-leadership-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/monitor_issuer_announcements.py
      - name: Save monitoring results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/announcement_monitor_snapshot.json data/announcement_review_queue.json public/data/announcement-monitor.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh UK leadership announcement monitoring"
          git pull --rebase origin main
          git push
