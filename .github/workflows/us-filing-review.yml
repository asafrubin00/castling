name: Collect US governance filing candidates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/us-filing-review.yml"
      - "scripts/collect_us_filings.py"
  schedule:
    - cron: "30 12 * * 1-5"

permissions:
  contents: write

concurrency:
  group: us-filing-review
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name != 'schedule' || vars.US_FILING_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Collect filings for 500 research issuers
        run: python scripts/collect_us_filings.py --holdings-research --coverage-output public/data/us-filing-coverage.json
      - name: Publish filing discovery coverage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/us-filing-coverage.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh US filing coverage"
          # This job only commits its generated catalog. Prefer that fresh catalog on rebase.
          git pull --rebase --strategy-option=theirs origin main
          git push
      - name: Save candidate list
        uses: actions/upload-artifact@v4
        with:
          name: us-filing-review
          path: data/raw/us/filing-review.json
          if-no-files-found: error
          retention-days: 14
